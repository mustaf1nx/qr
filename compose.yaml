services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: eventpass
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: eventpass
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventpass"]
      interval: 5s
      retries: 10
  app:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://eventpass:${POSTGRES_PASSWORD}@db:5432/eventpass
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres:
